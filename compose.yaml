services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: papikos
      POSTGRES_USER: papikos
      POSTGRES_PASSWORD: papikos
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./database/migrations/002_auth_schema.sql:/docker-entrypoint-initdb.d/002_auth_schema.sql:ro
      - ./database/migrations/003_sessions_schema.sql:/docker-entrypoint-initdb.d/003_sessions_schema.sql:ro
      - ./database/migrations/004_renter_actions_schema.sql:/docker-entrypoint-initdb.d/004_renter_actions_schema.sql:ro
      - ./database/migrations/005_password_resets_schema.sql:/docker-entrypoint-initdb.d/005_password_resets_schema.sql:ro
      - ./database/migrations/006_owner_workflows_schema.sql:/docker-entrypoint-initdb.d/006_owner_workflows_schema.sql:ro
      - ./database/seeds/001_mock_data.sql:/docker-entrypoint-initdb.d/007_mock_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papikos -d papikos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://papikos:papikos@db:5432/papikos
      PORT: 3000
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      SESSION_DAYS: 7
      PUBLIC_APP_URL: http://localhost:3000
      EXPOSE_RESET_TOKEN: "true"
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:

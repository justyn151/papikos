services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: papikos
      POSTGRES_USER: papikos
      POSTGRES_PASSWORD: papikos
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./database/migrations/002_auth_schema.sql:/docker-entrypoint-initdb.d/002_auth_schema.sql:ro
      - ./database/migrations/003_sessions_schema.sql:/docker-entrypoint-initdb.d/003_sessions_schema.sql:ro
      - ./database/migrations/004_renter_actions_schema.sql:/docker-entrypoint-initdb.d/004_renter_actions_schema.sql:ro
      - ./database/migrations/005_password_resets_schema.sql:/docker-entrypoint-initdb.d/005_password_resets_schema.sql:ro
      - ./database/migrations/006_owner_workflows_schema.sql:/docker-entrypoint-initdb.d/006_owner_workflows_schema.sql:ro
      - ./database/migrations/007_normalize_facilities.sql:/docker-entrypoint-initdb.d/007_normalize_facilities.sql:ro
      - ./database/migrations/008_normalize_locations.sql:/docker-entrypoint-initdb.d/008_normalize_locations.sql:ro
      - ./database/migrations/009_renter_request_context.sql:/docker-entrypoint-initdb.d/009_renter_request_context.sql:ro
      - ./database/migrations/010_admin_owner_system.sql:/docker-entrypoint-initdb.d/010_admin_owner_system.sql:ro
      - ./database/migrations/011_owner_listing_content.sql:/docker-entrypoint-initdb.d/011_owner_listing_content.sql:ro
      - ./database/migrations/012_custom_listing_content_and_demo_login.sql:/docker-entrypoint-initdb.d/012_custom_listing_content_and_demo_login.sql:ro
      - ./database/seeds/001_mock_data.sql:/docker-entrypoint-initdb.d/013_mock_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papikos -d papikos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://papikos:papikos@db:5432/papikos
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      SESSION_DAYS: 7
      PUBLIC_APP_URL: http://localhost:3000
      EXPOSE_RESET_TOKEN: "true"
      MEDIA_ROOT: /app/uploads
    ports:
      - "3001:8000"
    volumes:
      - media-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
        VITE_SHOW_DEMO_ACCOUNTS: "true"
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  media-data:

services:
  db:
    image: postgres:18-alpine
    container_name: papikos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: papikos
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d papikos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: papikos-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/papikos
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
